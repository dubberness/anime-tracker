services:
  anime-tracker:
    # Pull the published image by default; swap to `build: .` to build locally.
    image: ghcr.io/dubberness/anime-tracker:latest
    # build: .
    container_name: anime-tracker
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /mnt/user/appdata/anime-tracker:/config
    environment:
      - PUID=99
      - PGID=100
      - TZ=Australia/Hobart
      - WEB_PORT=8080
      # Everything else - schedule, URLs, API keys, what to track - is managed
      # from the settings page and stored in /config/config.json. Setting one
      # of those as an env var here locks that field in the UI.
